app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://croppulse.onrender.com}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
spring.application.name=CropPulse
server.port=${PORT:8080}

# Groq AI Configuration (Free API)
groq.api.key=${GROQ_API_KEY:demo-api-key}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET:croppulse-secret-key-change-in-production-very-long-secret-key-at-least-256-bits}
jwt.expiration=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:demo-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.reset.base-url=${RESET_PASSWORD_URL:http://localhost:5173/reset-password?token=}
