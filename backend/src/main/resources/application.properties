app.cors.allowed-origins=http://localhost:5173
ai.service.url=http://localhost:8000
spring.application.name=CropPulse

# Groq AI Configuration (Free API)
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Database config
spring.datasource.url=jdbc:postgresql://localhost:5432/croppulse_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
jwt.secret=${JWT_SECRET:croppulse-secret-key-change-in-production}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used in password reset email link (frontend page that handles token)
app.reset.base-url=http://localhost:5173/reset-password?token=