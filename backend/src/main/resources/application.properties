app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://croppulse.onrender.com}
ai.service.url=http://localhost:8000
spring.application.name=CropPulse
server.port=${PORT:8080}


# Groq AI Configuration (Free API)
groq.api.key=${GROQ_API_KEY:demo-api-key}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Database config - PostgreSQL (for production/docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:croppulse_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jwt.secret=${JWT_SECRET:croppulse-secret-key-change-in-production}
jwt.expiration=86400000



spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:demo-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.reset.base-url=http://localhost:5173/reset-password?token=