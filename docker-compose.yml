version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: croppulse-db
    environment:
      MONGO_INITDB_DATABASE: croppulse
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - croppulse-network

  backend:
    build: ./backend
    container_name: croppulse-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/croppulse
      GROQ_API_KEY: your_groq_api_key_here
      JWT_SECRET: your_secret_key_here_change_in_production
      MAIL_USERNAME: your_email@gmail.com
      MAIL_PASSWORD: your_app_password_here
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      AI_SERVICE_URL: http://localhost:8000
    depends_on:
      - mongo
    networks:
      - croppulse-network

volumes:
  mongo_data:

networks:
  croppulse-network:
    driver: bridge
